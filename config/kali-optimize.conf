#!/bin/bash
# Kali Linux Optimization Script - Configuration File
# Modifique este arquivo para customizar o comportamento do script

# ====================================================
# CONFIGURAÇÕES DE FIRMWARE
# ====================================================

# Pacotes de firmware a instalar
# Altere conforme suas necessidades de hardware
FW_PACKAGES="firmware-linux firmware-linux-nonfree firmware-iwlwifi firmware-realtek firmware-atheros firmware-brcm80211"

# Pular instalação de firmware (true/false)
SKIP_FIRMWARE=${SKIP_FIRMWARE:-false}

# ====================================================
# CONFIGURAÇÕES DE LIMPEZA
# ====================================================

# Dias de logs journalctl a manter
JOURNAL_VACUUM_TIME="3d"

# Remover /tmp ao iniciar (true/false)
CLEAN_TMP=true

# Remover /var/tmp ao iniciar (true/false)
CLEAN_VAR_TMP=true

# Limpar cache de thumbnails (true/false)
CLEAN_THUMBNAILS=true

# ====================================================
# CONFIGURAÇÕES DE PERFORMANCE
# ====================================================

# Valor de swappiness (0-100)
# Valores menores = menos uso de swap
SWAPPINESS_VALUE=10

# Limiar de RAM para aplicar swappiness (em GB)
# Se RAM < este valor, aplicar swappiness
RAM_THRESHOLD=10

# Limpar cache de memória após limpeza (true/false)
# ⚠️ Use com cuidado - pode causar lag temporário
CLEAN_MEMORY_CACHE=false

# ====================================================
# CONFIGURAÇÕES DE SISTEMA
# ====================================================

# Pular reinicialização ao final (true/false)
SKIP_REBOOT=${SKIP_REBOOT:-false}

# Modo simulação - não executar comandos reais (true/false)
DRY_RUN=${DRY_RUN:-false}

# Nível de verbosidade (0=silencioso, 1=normal, 2=detalhado, 3=debug)
VERBOSITY=1

# ====================================================
# CONFIGURAÇÕES DE LOGGING
# ====================================================

# Diretório de logs
LOG_DIR="/var/log"

# Manter quantos logs antigos
LOG_RETENTION_DAYS=7

# ====================================================
# CONFIGURAÇÕES DE BACKUP
# ====================================================

# Criar backup de configurações antes de alterar (true/false)
BACKUP_CONFIGS=true

# Diretório de backup
BACKUP_DIR="/var/backups/kali-optimize"

# ====================================================
# CONFIGURAÇÕES DE REDE
# ====================================================

# Verificar conexão de internet antes de executar (true/false)
CHECK_INTERNET=true

# Host para testar internet (ping)
INTERNET_TEST_HOST="8.8.8.8"

# Timeout para teste de internet (segundos)
INTERNET_TEST_TIMEOUT=5

# ====================================================
# CONFIGURAÇÕES DE KALI LINUX
# ====================================================

# Instalar kali-linux-core (true/false)
INSTALL_KALI_CORE=true

# Instalar kali-tools-top10 (true/false)
INSTALL_KALI_TOOLS=true

# Atualizar exploitdb/searchsploit (true/false)
UPDATE_EXPLOITDB=true

# ====================================================
# CONFIGURAÇÕES AVANÇADAS
# ====================================================

# Usar apt-fast se disponível (true/false)
USE_APT_FAST=false

# Instalar deborphan para limpar dependências órfãs (true/false)
USE_DEBORPHAN=true

# Verificar integridade de pacotes com debsums (true/false)
# ⚠️ Pode ser lento em sistemas grandes
CHECK_INTEGRITY=true

# Número máximo de erros debsums a mostrar
DEBSUMS_MAX_ERRORS=50

# ====================================================
# NÃO EDITE ABAIXO DESTE PONTO
# ====================================================

# Variáveis geradas dinamicamente
SCRIPT_VERSION="2.0.0"
SCRIPT_DATE="2026-07-04"
KALI_OPTIMIZE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
